<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAOL 운송 이벤트 관리</title><style>:root{--b:#1557b0;--i:#152033;--m:#62718a;--l:#e3e9f2;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.top a{color:var(--b);text-decoration:none;font-weight:800}.panel{background:#fff;border:1px solid var(--l);border-radius:18px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd8e8;border-radius:10px;padding:11px;font:inherit;background:#fff}.field textarea{min-height:90px;resize:vertical}.wide{grid-column:1/-1}.btn{border:0;border-radius:10px;background:var(--b);color:#fff;padding:11px 15px;font-weight:900;cursor:pointer}.muted{color:var(--m);font-size:13px}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px}.ok{display:block;background:#e5f8ef;color:#075d43}.err{display:block;background:#ffeaed;color:#981b2c}.event{padding:14px 0;border-bottom:1px solid var(--l)}.event:last-child{border:0}.event small{display:block;color:var(--m)}.badge{display:inline-block;background:#eaf2ff;color:#1658ae;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800}.login{max-width:460px;margin:70px auto}.quick{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 16px}.quick button{border:1px solid #cbd7e6;background:#fff;color:var(--b);border-radius:999px;padding:7px 10px;cursor:pointer;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start}}</style></head><body><div class="wrap"><div class="top"><div><div class="muted">DAOL SEA & AIR · ADMIN</div><h1>운송 이벤트 관리</h1></div><a href="portal.html">← 고객포털</a></div><div id="login" class="panel login"><h2>관리자 로그인</h2><div class="field"><label>이메일</label><input id="email" type="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password"></div><button id="loginBtn" class="btn">로그인</button><div id="loginMsg" class="msg"></div></div><div id="app" hidden><div class="panel"><h2>운송 이벤트 추가</h2><p class="muted">이벤트를 저장하면 고객의 MY SHIPMENT 타임라인에 바로 표시됩니다.</p><form id="eventForm"><div class="grid"><div class="field wide"><label>운송 건</label><select id="shipment" name="shipment_id" required></select></div><div class="field"><label>이벤트 일시</label><input id="eventAt" name="event_at" type="datetime-local" required></div><div class="field"><label>위치</label><input id="location" name="location" placeholder="BUSAN / SHEKOU / CHENNAI"></div><div class="field wide"><label>이벤트 종류</label><input id="eventType" name="event_type" required placeholder="예: 부산 선적 완료"></div></div><div class="quick"><button type="button" data-v="Booking Confirmed">Booking Confirmed</button><button type="button" data-v="Gate In">Gate In</button><button type="button" data-v="Loaded on Vessel">Loaded on Vessel</button><button type="button" data-v="Vessel Departed">Vessel Departed</button><button type="button" data-v="Transshipment Arrived">환적항 도착</button><button type="button" data-v="Transshipment Loaded">환적선 선적</button><button type="button" data-v="Vessel Arrived">목적항 도착</button><button type="button" data-v="Customs Clearance">통관</button><button type="button" data-v="Delivered">배송 완료</button></div><div class="field"><label>상세 내용</label><textarea name="description" placeholder="선박명, 항차, 환적 예정 등 고객에게 보여줄 내용을 입력하세요."></textarea></div><div class="grid"><div class="field"><label>운송 상태도 변경</label><select name="new_status"><option value="">변경 안 함</option><option value="booking">예약</option><option value="in_transit">운송 중</option><option value="transshipment">환적 중</option><option value="customs">통관 중</option><option value="delivered">배송 완료</option><option value="exception">예외 발생</option></select></div><div class="field"><label>최근 위치에 반영</label><select name="update_location"><option value="yes">예</option><option value="no">아니오</option></select></div></div><button class="btn">이벤트 저장</button><div id="msg" class="msg"></div></form></div><div class="panel"><h2>최근 등록 이벤트</h2><div id="events"></div></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.95.3';const s=createClient('https://ombszlldcfyxxfowqyfx.supabase.co','sb_publishable_wiOlSr85u9OiOBLTXhhEjw_Tlcyb7s9'),$=x=>document.getElementById(x);let shipments=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(id,t,e=false){$(id).textContent=t;$(id).className='msg '+(e?'err':'ok')}function localNow(){const d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}$('eventAt').value=localNow();document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{$('eventType').value=b.dataset.v});$('loginBtn').onclick=async()=>{const{error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('loginMsg',error.message,true);boot()};async function boot(){const{data:{user}}=await s.auth.getUser();if(!user)return;const{data:p}=await s.from('profiles').select('role').eq('id',user.id).single();if(!p||p.role!=='admin'){await s.auth.signOut();return msg('loginMsg','관리자 계정만 사용할 수 있습니다.',true)}$('login').hidden=true;$('app').hidden=false;await load()}async function load(){const{data:rows,error}=await s.from('shipments').select('id,reference_no,bl_no,container_no,origin,destination').order('updated_at',{ascending:false});if(error)return msg('msg',error.message,true);shipments=rows||[];$('shipment').innerHTML='<option value="">운송 건을 선택하세요</option>'+shipments.map(x=>`<option value="${x.id}">${esc(x.reference_no)} · ${esc(x.bl_no||x.container_no||'-')} · ${esc(x.origin)}→${esc(x.destination)}</option>`).join('');const{data:ev}=await s.from('shipment_events').select('*,shipments(reference_no)').order('event_at',{ascending:false}).limit(15);$('events').innerHTML=(ev||[]).length?(ev||[]).map(e=>`<div class="event"><strong>${esc(e.shipments?.reference_no||'')} · ${esc(e.event_type)}</strong><small>${new Date(e.event_at).toLocaleString('ko-KR')}${e.location?' · '+esc(e.location):''}</small>${e.description?`<div>${esc(e.description)}</div>`:''}</div>`).join(''):'<div class="muted">등록된 이벤트가 없습니다.</div>'}$('eventForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),shipment_id=f.get('shipment_id'),location=String(f.get('location')||'').trim()||null,event_type=String(f.get('event_type')||'').trim(),description=String(f.get('description')||'').trim()||null,event_at=new Date(f.get('event_at')).toISOString();const{error}=await s.from('shipment_events').insert({shipment_id,event_at,location,event_type,description});if(error)return msg('msg',error.message,true);const patch={tracking_updated_at:new Date().toISOString()};if(f.get('update_location')==='yes'&&location)patch.last_location=location;if(f.get('new_status'))patch.status=f.get('new_status');const{error:ue}=await s.from('shipments').update(patch).eq('id',shipment_id);if(ue)return msg('msg','이벤트는 저장됐지만 운송정보 갱신 실패: '+ue.message,true);msg('msg','운송 이벤트가 저장됐습니다. 고객 타임라인에 반영됩니다.');e.target.reset();$('eventAt').value=localNow();await load()};const{data:{session}}=await s.auth.getSession();if(session)boot();</script></body></html>
