lass="field"><label>선사</label><input name="carrier"></div><div class="field"><label>선박/편명</label><input name="vessel_or_flight"></div><div class="field"><label>항차</label><input name="voyage_or_flight_no"></div><div class="field"><label>환적항</label><input name="transshipment_port"></div><div class="field"><label>ETD</label><input name="etd" type="date"></div><div class="field"><label>ETA</label><input name="eta" type="date"></div><div class="field wide"><label>최근 위치</label><input name="last_location"></div><div class="field"><label>Tracking Provider</label><input name="tracking_provider" placeholder="API 연결 후 자동 설정"></div><div class="field"><label>Tracking 동기화</label><select name="tracking_sync_enabled"><option value="true">사용</option><option value="false">사용 안 함</option></select></div></div><button class="btn">운송 저장</button></form></div><div class="panel"><h3>운송 수정 / 삭제</h3><div id="shipmentManage"></div></div><div class="panel"><h3>이벤트 추가</h3><form id="eventForm"><div class="field"><label>운송 건</label><select name="shipment_id" id="eventShipment" required></select></div><div class="field"><label>이벤트</label><input name="event_type" required></div><div class="field"><label>일시</label><input name="event_at" type="datetime-local" required></div><div class="field"><label>위치</label><input name="location"></div><div class="field"><label>상세내용</label><textarea name="description"></textarea></div><button class="btn">이벤트 저장</button></form><div id="eventManage"></div></div><div class="panel"><h3>견적 등록</h3><form id="quoteForm"><div class="form-grid"><div class="field"><label>고객사</label><select name="company_id" class="company-select" required></select></div><div class="field"><label>견적번호</label><input name="quote_no" required></div><div class="field"><label>방식</label><select name="mode"><option value="sea">해상</option><option value="air">항공</option></select></div><div class="field"><label>상태</label><select name="status"><option value="draft">작성 중</option><option value="sent">발송</op |[];$('shipmentCount').textContent=shipments.length;$('activeCount').textContent=shipments.filter(x=>!['delivered','exception'].includes(x.status)).length;$('quoteCount').textContent=quotes.length;$('shipmentCards').innerHTML=shipments.length?shipments.map(x=>`<div class="shipment-card"><div class="ship-top"><strong>${esc(x.reference_no)}</strong><span class="badge">${statusName[x.status]||esc(x.status)}</span></div><div class="route">${esc(x.origin)} → ${esc(x.destination)}</div><small>${esc(x.bl_no||'-')} · ${esc(x.container_no||'-')} · ${esc(x.vessel_or_flight||x.carrier||'-')}</small><div style="margin-top:8px"><small>ETD ${esc(x.etd||'-')} · ETA ${esc(x.eta||'-')}${x.last_location?' · 최근 위치 '+esc(x.last_location):''}</small></div>${x.transshipment_port||x.next_vessel_or_flight?'<div><small>환적 '+esc(x.transshipment_port||'-')+(x.next_vessel_or_flight?' · 연결 '+esc(x.next_vessel_or_flight)+(x.next_voyage_or_flight_no?' '+esc(x.next_voyage_or_flight_no):''):'')+'</small></div>':''}${x.tracking_updated_at?'<div><small>Tracking 업데이트 '+new Date(x.tracking_updated_at).toLocaleString('ko-KR')+(x.tracking_source?' · '+esc(x.tracking_source):'')+'</small></div>':''}<div>${(x.shipment_events||[]).sort((a,b)=>new Date(b.event_at)-new Date(a.event_at)).slice(0,3).map(e=>`<div><b>${esc(e.event_type)}</b> <small>${new Date(e.event_at).toLocaleString('ko-KR')} · ${esc(e.location||'-')}</small></div>`).join('')}</div></div>`).join(''):'<p class="muted">등록된 운송 건이 없습니다.</p>';$('quoteCards').innerHTML=quotes.length?quotes.map(q=>`<div class="manage-row"><strong>${esc(q.quote_no)} · ${esc(q.origin)} → ${esc(q.destination)}</strong><small>${esc(q.currency||'KRW')} ${q.total_amount==null?'-':Number(q.total_amount).toLocaleString()} · ${statusName[q.status]||q.status} · 유효 ${esc(q.valid_until||'-')}</small></div>`).join(''):'<p class="muted">등록된 견적이 없습니다.</p>'}async function loadAdmin(){const[{data:c},{data:p}]=await Promise.all([supabase.from('companies').select('*').order('name'),supabase.from('profiles').select('*').order('created_at',{ascending:false})]);companies=c||[];profiles=p||[];renderAdmin()}function renderAdmin(){const co='<option value="">고객사 선택</option>'+companies.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('companySelect').innerHTML=co;document.querySelectorAll('.company-select').forEach(x=>x.innerHTML=co);$('eventShipment').innerHTML='<option value="">운송 건 선택</option>'+shipments.map(x=>`<option value="${x.id}">${esc(x.reference_no)}</option>`).join('');document.querySelector('#eventForm [name=event_at]').value=localDT(new Date());$('companyManage').innerHTML=companies.map(x=>`<div class="manage-row"><strong>${esc(x.name)}</strong><small>${esc(x.business_registration_no||'')} ${esc(x.contact_name||'')}</small><div class="row-actions"><button class="btn ghost edit-company" data-id="${x.id}">수정</button></div></div>`).join('');$('profileManage').innerHTML=profiles.filter(x=>x.role==='customer').map(x=>`<div class="manage-row"><strong>${esc(x.full_name||x.email)}</strong><small>${esc(x.email)}</small><select class="profile-company" data-id="${x.id}">${co}</select></div>`).join('')||'<p class="muted">고객 계정 없음</p>';document.querySelectorAll('.profile-company').forEach(el=>{const p=profiles.find(x=>x.id===el.dataset.id);el.value=p?.company_id||'';el.onchange=async()=>{const{error}=await supabase.from('profiles').update({company_id:el.value||null}).eq('id',el.dataset.id);msg(error?'고객사 연결 실패: '+error.message:'고객 계정의 고객사 연결을 저장했습니다.',!!error);await loadAdmin()}});$('shipmentManage').innerHTML=shipments.map(x=>`<div class="manage-row"><strong>${esc(x.reference_no)}</strong><small>${esc(x.origin)} → ${esc(x.destination)}</small><div class="row-actions"><button class="btn ghost edit-ship" data-id="${x.id}">수정</button><button class="btn danger del-ship" data-id="${x.id}">삭제</button></div></div>`).join('')||'<p class="muted">운송 건 없음</p>';const ev=shipments.flatMap(s=>(s.shipment_events||[]).map(e=>({...e,ref:s.reference_no})));$('eventManage').innerHTML=ev.map(e=>`<div class="manage-row"><strong>${esc(e.ref)} · ${esc(e.event_type)}</strong><small>${new Date(e.event_at).toLocaleString('ko-KR')} · ${esc(e.location||'-')}</small><div class="row-actions"><button class="btn ghost edit-event" data-id="${e.id}">수정</button><button class="btn danger del-event" data-id="${e.id}">삭제</button></div></div>`).join('')||'<p class="muted">이벤트 없음</p>';$('quoteManage').innerHTML=quotes.map(q=>`<div class="manage-row"><strong>${esc(q.quote_no)}</strong><small>${esc(q.origin)} → ${esc(q.destination)} · ${statusName[q.status]||q.status}</small><div class="row-actions"><button class="btn ghost edit-quote" data-id="${q.id}">수정</button><button class="btn danger del-quote" data-id="${q.id}">삭제</button></div></div>`).join('')||'<p class="muted">견적 없음</p>';bindButtons()}function field(n,l,v='',type='text'){return`<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v||'')}"></div>`}function openEdit(type,id){editType=type;editId=id;let x,html='';if(type==='company'){x=companies.find(v=>v.id===id);$('editTitle').textContent='고객사 수정';html=field('name','회사명',x.name)+field('business_registration_no','사업자번호',x.business_registration_no)+field('contact_name','담당자',x.contact_name)+field('contact_email','이메일',x.contact_email,'email')+field('contact_phone','전화번호',x.contact_phone)}if(type==='shipment'){x=shipments.find(v=>v.id===id);$('editTitle').textContent='운송 건 수정';html=field('reference_no','관리번호',x.reference_no)+field('origin','출발지',x.origin)+field('destination','도착지',x.destination)+field('bl_no','B/L / AWB',x.bl_no)+field('container_no','Container',x.container_no)+field('carrier','선사',x.carrier)+field('vessel_or_flight','선박/편명',x.vessel_or_flight)+field('voyage_or_flight_no','항차',x.voyage_or_flight_no)+field('etd','ETD',x.etd,'date')+field('eta','ETA',x.eta,'date')+field('last_location','최근 위치',x.last_location)+field('transshipment_port','환적항',x.transshipment_port)+field('next_vessel_or_flight','다음 연결 선박/편명',x.next_vessel_or_flight)+field('next_voyage_or_flight_no','다음 항차/편명',x.next_voyage_or_flight_no)+field('tracking_source','Tracking 출처',x.tracking_source)+field('tracking_provider','Tracking Provider',x.tracking_provider)}if(type==='event'){x=shipments.flatMap(s=>s.shipment_events||[]).find(v=>v.id===id);$('editTitle').textContent='이벤트 수정';html=field('event_type','이벤트',x.event_type)+field('event_at','일시',localDT(x.event_at),'datetime-local')+field('location','위치',x.location)+field('description','상세내용',x.description)}if(type==='quote'){x=quotes.find(v=>v.id===id);$('editTitle').textContent='견적 수정';html=field('quote_no','견적번호',x.quote_no)+field('origin','출발지',x.origin)+field('destination','도착지',x.destination)+field('currency','통화',x.currency)+field('total_amount','총액',x.total_amount,'number')+field('valid_until','유효기간',x.valid_until,'date')+field('cargo_summary','화물내용',x.cargo_summary)+field('notes','비고',x.notes)}$('editFields').innerHTML=html;$('editDialog').showModal()}function bindButtons(){document.querySelectorAll('.edit-company').forEach(b=>b.onclick=()=>openEdit('company',b.dataset.id));document.querySelectorAll('.edit-ship').forEach(b=>b.onclick=()=>openEdit('shipment',b.dataset.id));document.querySelectorAll('.edit-event').forEach(b=>b.onclick=()=>openEdit('event',b.dataset.id));document.querySelectorAll('.edit-quote').forEach(b=>b.onclick=()=>openEdit('quote',b.dataset.id));document.querySelectorAll('.del-ship').forEach(b=>b.onclick=()=>del('shipments',b.dataset.id,'운송 건'));document.querySelectorAll('.del-event').forEach(b=>b.onclick=()=>del('shipment_events',b.dataset.id,'이벤트'));document.querySelectorAll('.del-quote').forEach(b=>b.onclick=()=>del('freight_quotes',b.dataset.id,'견적'))}async function del(table,id,label){if(!confirm(`${label}을 삭제하시겠습니까?`))return;const{error}=await supabase.from(table).delete().eq('id',id);msg(error?`${label} 삭제 실패: ${error.message}`:`${label}을 삭제했습니다.`,!!error);await refresh();await loadAdmin()}$('companyForm').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.from('companies').insert(obj(e.target));msg(error?error.message:'고객사를 저장했습니다.',!!error);if(!error){e.target.reset();await loadAdmin()}};$('shipmentForm').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.from('shipments').insert(obj(e.target));msg(error?error.message:'운송 건을 저장했습니다.',!!error);if(!error){e.target.reset();await refresh();await loadAdmin()}};$('eventForm').onsubmit=async e=>{e.preventDefault();const p=obj(e.target);p.event_at=new Date(p.event_at).toISOString();const{error}=await supabase.from('shipment_events').insert(p);msg(error?error.message:'이벤트를 저장했습니다.',!!error);if(!error){e.target.reset();await refresh();await loadAdmin()}};$('quoteForm').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.from('freight_quotes').insert(obj(e.target));msg(error?error.message:'견적을 저장했습니다.',!!error);if(!error){e.target.reset();await refresh();await loadAdmin()}};$('editForm').onsubmit=async e=>{e.preventDefault();const p=obj(e.target);let table=editType==='company'?'companies':editType==='shipment'?'shipments':editType==='event'?'shipment_events':'freight_quotes';if(editType==='event'&&p.event_at)p.event_at=new Date(p.event_at).toISOString();const{error}=await supabase.from(table).update(p).eq('id',editId);if(error)return msg('수정 실패: '+error.message,true);$('editDialog').close();msg('수정 내용을 저장했습니다.');await refresh();await loadAdmin()};(async()=>{const{data:{session}}=await supabase.auth.getSession();if(session)load()})();</script></body></html>
