<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAOL 고객 물류포털</title><style>:root{--blue:#1557b0;--ink:#152033;--muted:#62718a;--line:#e3e9f2;--bg:#f5f8fc;--red:#bd2737}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 24px}header{background:#fff;border-bottom:1px solid var(--line)}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:20px;color:var(--blue)}.back{color:var(--muted);text-decoration:none}.hero{padding:34px 0 22px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.auth{max-width:500px;margin:auto}.field{display:grid;gap:6px;margin:11px 0}.field label{font-weight:800;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd9e7;border-radius:10px;padding:10px 12px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.ghost{background:#fff;border:1px solid #cbd7e6;color:var(--blue)}.btn.danger{background:#fff;border:1px solid #efb7bd;color:var(--red)}.actions,.row-actions{display:flex;gap:8px;flex-wrap:wrap}.message{display:none;margin:12px 0;padding:10px;border-radius:9px}.message.ok{display:block;background:#e5f8ef;color:#075d43}.message.err{display:block;background:#ffeaed;color:#981b2c}.portal,.admin{display:none}.portal.show,.admin.show{display:block}.cards,.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{font-size:26px;color:var(--blue);display:block}.muted,small{color:var(--muted)}.shipment-card,.manage-row{border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}.ship-top,.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.route{font-size:18px;font-weight:900}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;background:#eaf2ff;color:#1658ae}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table td{padding:9px;border-bottom:1px solid var(--line)}dialog{border:0;border-radius:18px;max-width:720px;width:calc(100% - 30px);padding:0;box-shadow:0 25px 70px #0004}dialog::backdrop{background:#13233b99}.modal{padding:22px}.danger-note{background:#fff1f2;color:#8e1e2c;padding:10px;border-radius:9px;font-size:13px}@media(max-width:820px){.cards,.admin-grid,.stats,.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><div class="wrap nav"><div class="brand">DAOL SEA &amp; AIR · CUSTOMER PORTAL</div><a class="back" href="index.html">← 홈페이지</a></div></header><main class="wrap"><section class="hero"><h1>MY SHIPMENT</h1><p class="muted">고객사별 운송현황 · 타임라인 · 견적정보</p></section><div id="authBox" class="panel auth"><h2>고객 로그인</h2><form id="authForm"><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" required></div><button class="btn">로그인</button></form><div id="authMessage" class="message"></div></div><div id="portal" class="portal"><div class="topline"><div><h2 id="welcome"></h2></div><button class="btn ghost" id="signOut">로그아웃</button></div><div class="stats"><div class="stat"><small>진행 중</small><strong id="activeCount">0</strong></div><div class="stat"><small>전체 운송</small><strong id="shipmentCount">0</strong></div><div class="stat"><small>견적</small><strong id="quoteCount">0</strong></div></div><div class="panel"><h3>운송 현황</h3><div id="shipmentCards" class="cards"></div></div><div id="adminPanel" class="admin"><h2>다올 관리자 관리</h2><div id="adminMessage" class="message"></div><div class="admin-grid"><div class="panel"><h3>신규 운송 등록</h3><form id="shipmentForm"><div class="form-grid"><div class="field"><label>고객사</label><select name="company_id" id="companySelect" required></select></div><div class="field"><label>관리번호</label><input name="reference_no" required></div><div class="field"><label>방식</label><select name="mode"><option value="sea">해상</option><option value="air">항공</option></select></div><div class="field"><label>상태</label><select name="status"><option value="booking">예약</option><option value="in_transit">운송 중</option><option value="transshipment">환적 중</option><option value="customs">통관 중</option><option value="delivered">배송 완료</option><option value="exception">예외</option></select></div><div class="field"><label>출발지</label><input name="origin" required></div><div class="field"><label>도착지</label><input name="destination" required></div><div class="field"><label>B/L / AWB</label><input name="bl_no"></div><div class="field"><label>Container</label><input name="container_no"></div><div class="field"><label>선사</label><input name="carrier"></div><div class="field"><label>선박/편명</label><input name="vessel_or_flight"></div><div class="field"><label>항차</label><input name="voyage_or_flight_no"></div><div class="field"><label>환적항</label><input name="transshipment_port"></div><div class="field"><label>ETD</label><input name="etd" type="date"></div><div class="field"><label>ETA</label><input name="eta" type="date"></div><div class="field wide"><label>최근 위치</label><input name="last_location"></div></div><button class="btn">운송 저장</button></form></div><div class="panel"><h3>운송 건 수정 / 삭제</h3><div id="shipmentManage"></div></div><div class="panel"><h3>이벤트 추가</h3><form id="eventForm"><div class="field"><label>운송 건</label><select name="shipment_id" id="eventShipment" required></select></div><div class="form-grid"><div class="field"><label>이벤트</label><input name="event_type" placeholder="Departed" required></div><div class="field"><label>일시</label><input name="event_at" type="datetime-local" required></div><div class="field"><label>위치</label><input name="location"></div><div class="field wide"><label>상세내용</label><textarea name="description"></textarea></div></div><button class="btn">이벤트 저장</button></form></div><div class="panel"><h3>이벤트 수정 / 삭제</h3><div id="eventManage"></div></div></div></div></div></main><dialog id="shipmentDialog"><div class="modal"><div class="topline"><h3>운송 건 수정</h3><button class="btn ghost" type="button" onclick="this.closest('dialog').close()">닫기</button></div><form id="shipmentEditForm"><input type="hidden" name="id"><div class="form-grid"><div class="field"><label>관리번호</label><input name="reference_no" required></div><div class="field"><label>상태</label><select name="status"><option value="booking">예약</option><option value="in_transit">운송 중</option><option value="transshipment">환적 중</option><option value="customs">통관 중</option><option value="delivered">배송 완료</option><option value="exception">예외</option></select></div><div class="field"><label>출발지</label><input name="origin" required></div><div class="field"><label>도착지</label><input name="destination" required></div><div class="field"><label>B/L / AWB</label><input name="bl_no"></div><div class="field"><label>Container</label><input name="container_no"></div><div class="field"><label>선사</label><input name="carrier"></div><div class="field"><label>선박/편명</label><input name="vessel_or_flight"></div><div class="field"><label>항차</label><input name="voyage_or_flight_no"></div><div class="field"><label>환적항</label><input name="transshipment_port"></div><div class="field"><label>ETD</label><input name="etd" type="date"></div><div class="field"><label>ETA</label><input name="eta" type="date"></div><div class="field wide"><label>최근 위치</label><input name="last_location"></div></div><button class="btn">수정 저장</button></form></div></dialog><dialog id="eventDialog"><div class="modal"><div class="topline"><h3>이벤트 수정</h3><button class="btn ghost" type="button" onclick="this.closest('dialog').close()">닫기</button></div><form id="eventEditForm"><input type="hidden" name="id"><div class="field"><label>이벤트</label><input name="event_type" required></div><div class="field"><label>일시</label><input name="event_at" type="datetime-local" required></div><div class="field"><label>위치</label><input name="location"></div><div class="field"><label>상세내용</label><textarea name="description"></textarea></div><button class="btn">수정 저장</button></form></div></dialog><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.95.3';const supabase=createClient('https://ombszlldcfyxxfowqyfx.supabase.co','sb_publishable_wiOlSr85u9OiOBLTXhhEjw_Tlcyb7s9'),$=x=>document.getElementById(x);let profile,shipments=[],companies=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),statusName={booking:'예약',in_transit:'운송 중',transshipment:'환적 중',customs:'통관 중',delivered:'배송 완료',exception:'예외'},msg=(t,e=false)=>{$('adminMessage').textContent=t;$('adminMessage').className='message '+(e?'err':'ok')},obj=f=>Object.fromEntries([...new FormData(f)].map(([k,v])=>[k,v===''?null:v])),localDT=v=>{if(!v)return'';const d=new Date(v),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)};$('authForm').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMessage').textContent=error.message;$('authMessage').className='message err';return}load()};$('signOut').onclick=async()=>{await supabase.auth.signOut();location.reload()};async function load(){const{data:{user}}=await supabase.auth.getUser();if(!user)return;const{data:p}=await supabase.from('profiles').select('*').eq('id',user.id).single();profile=p;$('authBox').style.display='none';$('portal').classList.add('show');$('welcome').textContent=(p.full_name||p.email)+'님';await refresh();if(p.role==='admin'){$('adminPanel').classList.add('show');await loadAdmin()}}async function refresh(){const[{data:s},{data:q}]=await Promise.all([supabase.from('shipments').select('*,shipment_events(*)').order('updated_at',{ascending:false}),supabase.from('freight_quotes').select('id')]);shipments=s||[];$('shipmentCount').textContent=shipments.length;$('activeCount').textContent=shipments.filter(x=>!['delivered','exception'].includes(x.status)).length;$('quoteCount').textContent=(q||[]).length;$('shipmentCards').innerHTML=shipments.length?shipments.map(x=>`<div class="shipment-card"><div class="ship-top"><strong>${esc(x.reference_no)}</strong><span class="badge">${statusName[x.status]||esc(x.status)}</span></div><div class="route">${esc(x.origin)} → ${esc(x.destination)}</div><small>${esc(x.bl_no||'-')} · ${esc(x.container_no||'-')} · ${esc(x.vessel_or_flight||x.carrier||'-')}</small><div>${(x.shipment_events||[]).sort((a,b)=>new Date(b.event_at)-new Date(a.event_at)).slice(0,3).map(e=>`<div class="event"><b>${esc(e.event_type)}</b> <small>${new Date(e.event_at).toLocaleString('ko-KR')} · ${esc(e.location||'-')}</small></div>`).join('')}</div></div>`).join(''):'<p class="muted">등록된 운송 건이 없습니다.</p>'}async function loadAdmin(){const{data:c}=await supabase.from('companies').select('id,name').order('name');companies=c||[];const co='<option value="">고객사 선택</option>'+companies.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('companySelect').innerHTML=co;renderManage()}function renderManage(){const so='<option value="">운송 건 선택</option>'+shipments.map(x=>`<option value="${x.id}">${esc(x.reference_no)} · ${esc(x.bl_no||x.container_no||'')}</option>`).join('');$('eventShipment').innerHTML=so;document.querySelector('#eventForm [name=event_at]').value=localDT(new Date());$('shipmentManage').innerHTML=shipments.length?shipments.map(x=>`<div class="manage-row"><strong>${esc(x.reference_no)}</strong><small>${esc(x.origin)} → ${esc(x.destination)} · ${statusName[x.status]||x.status}</small><div class="row-actions"><button class="btn ghost edit-ship" data-id="${x.id}">수정</button><button class="btn danger del-ship" data-id="${x.id}">삭제</button></div></div>`).join(''):'<p class="muted">운송 건 없음</p>';const ev=shipments.flatMap(s=>(s.shipment_events||[]).map(e=>({...e,ref:s.reference_no}))).sort((a,b)=>new Date(b.event_at)-new Date(a.event_at));$('eventManage').innerHTML=ev.length?ev.map(e=>`<div class="manage-row"><strong>${esc(e.ref)} · ${esc(e.event_type)}</strong><small>${new Date(e.event_at).toLocaleString('ko-KR')} · ${esc(e.location||'-')}</small><div class="row-actions"><button class="btn ghost edit-event" data-id="${e.id}">수정</button><button class="btn danger del-event" data-id="${e.id}">삭제</button></div></div>`).join(''):'<p class="muted">이벤트 없음</p>';document.querySelectorAll('.edit-ship').forEach(b=>b.onclick=()=>editShip(b.dataset.id));document.querySelectorAll('.del-ship').forEach(b=>b.onclick=()=>deleteShip(b.dataset.id));document.querySelectorAll('.edit-event').forEach(b=>b.onclick=()=>editEvent(b.dataset.id));document.querySelectorAll('.del-event').forEach(b=>b.onclick=()=>deleteEvent(b.dataset.id))}function editShip(id){const x=shipments.find(s=>s.id===id),f=$('shipmentEditForm');if(!x)return;['id','reference_no','status','origin','destination','bl_no','container_no','carrier','vessel_or_flight','voyage_or_flight_no','transshipment_port','etd','eta','last_location'].forEach(k=>{if(f.elements[k])f.elements[k].value=x[k]||''});$('shipmentDialog').showModal()}async function deleteShip(id){const x=shipments.find(s=>s.id===id);if(!confirm(`${x?.reference_no||'이 운송 건'}을 삭제하시겠습니까?\n연결된 운송 이벤트도 함께 삭제될 수 있습니다.`))return;const{error}=await supabase.from('shipments').delete().eq('id',id);if(error)return msg('삭제 실패: '+error.message,true);msg('운송 건을 삭제했습니다.');await refresh();renderManage()}function editEvent(id){const ev=shipments.flatMap(s=>s.shipment_events||[]).find(e=>e.id===id),f=$('eventEditForm');if(!ev)return;f.elements.id.value=ev.id;f.elements.event_type.value=ev.event_type||'';f.elements.event_at.value=localDT(ev.event_at);f.elements.location.value=ev.location||'';f.elements.description.value=ev.description||'';$('eventDialog').showModal()}async function deleteEvent(id){if(!confirm('이 운송 이벤트를 삭제하시겠습니까?'))return;const{error}=await supabase.from('shipment_events').delete().eq('id',id);if(error)return msg('이벤트 삭제 실패: '+error.message,true);msg('운송 이벤트를 삭제했습니다.');await refresh();renderManage()}$('shipmentForm').onsubmit=async e=>{e.preventDefault();const{error}=await supabase.from('shipments').insert(obj(e.target));if(error)return msg(error.message,true);msg('운송 건을 저장했습니다.');e.target.reset();await refresh();renderManage()};$('eventForm').onsubmit=async e=>{e.preventDefault();const p=obj(e.target);p.event_at=new Date(p.event_at).toISOString();const{error}=await supabase.from('shipment_events').insert(p);if(error)return msg(error.message,true);msg('이벤트를 저장했습니다.');e.target.reset();await refresh();renderManage()};$('shipmentEditForm').onsubmit=async e=>{e.preventDefault();const p=obj(e.target),id=p.id;delete p.id;const{error}=await supabase.from('shipments').update({...p,tracking_updated_at:new Date().toISOString()}).eq('id',id);if(error)return msg('수정 실패: '+error.message,true);$('shipmentDialog').close();msg('운송 정보를 수정했습니다.');await refresh();renderManage()};$('eventEditForm').onsubmit=async e=>{e.preventDefault();const p=obj(e.target),id=p.id;delete p.id;p.event_at=new Date(p.event_at).toISOString();const{error}=await supabase.from('shipment_events').update(p).eq('id',id);if(error)return msg('이벤트 수정 실패: '+error.message,true);$('eventDialog').close();msg('운송 이벤트를 수정했습니다.');await refresh();renderManage()};(async()=>{const{data:{session}}=await supabase.auth.getSession();if(session)load()})();</script></body></html>
